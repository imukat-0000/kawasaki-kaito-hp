# 保存した一式の再公開：以前に正常に公開できたファイル一式を、作り直さずにそのまま公開し直す。
# （公開方式は GitHub Actions のまま。以前の公開方式「ブランチから公開」への切り戻しとは別の操作）
#
# 使い方: GitHub の Actions →「再公開（保存した一式）」→ Run workflow。一式の選び方は次のどちらか。
#   run_id: 「公開」の実行記録の番号（URLの runs/ の後ろの数字）。空欄なら、一式が残っている直近の正常な公開。
#           一式は7日間・新しい10回分まで残る。候補の一覧は、この実行の Summary に出る。
#           公開したファイルをそのまま公開し直すので、当時の公開内容と同じになる。
#   ref:    ブランチ名やコミット（例: published-pr-b = 新方式に切り替える前、PR B を公開した時点）。
#           保存した一式が残っていない、それより前の状態に戻すときに使う。
#           そのコミットに入っているファイルを、許可リストのとおりに並べ直す（展示情報の生成はしない）。
#           展示の分類（開催中・開催予定・過去）は、そのコミットで最後に展示情報を生成した日の状態のまま公開される。
#           ref を入れたときは run_id は使わない。
#
# 戻した内容が、次の push や毎日の自動実行で上書きされないように、pause_auto_publish（既定で オン）が
# 「公開」ワークフローを一時停止する。main 側を直したら、Actions →「公開」→ Enable workflow で再開し、
# Run workflow で一度公開する。

name: 再公開（保存した一式）

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '使う一式の「公開」実行記録の番号（空欄なら一式が残っている直近の正常な公開。残るのは7日間・10回分まで）'
        required: false
        default: ''
      ref:
        description: 'ブランチ名やコミット（例: published-pr-b）。一式が残っていない古い状態に戻すとき。入れると run_id より優先'
        required: false
        default: ''
      pause_auto_publish:
        description: '戻した内容が上書きされないよう、自動公開（「公開」ワークフロー）を一時停止する'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-publish-main
  cancel-in-progress: false

jobs:
  prepare:
    name: 一式を用意して確かめる
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # 自動公開の一時停止と、保存した一式の取り出しに使う
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 自動公開を一時停止する
        if: inputs.pause_auto_publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow disable publish.yml
          echo '自動公開（「公開」ワークフロー）を一時停止しました。再開は Actions →「公開」→ Enable workflow。' >> "$GITHUB_STEP_SUMMARY"

      - name: どの一式を使うか決める
        id: pick
        if: inputs.ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          {
            echo '### 正常に公開できた最近の一式'
            echo '| 実行記録の番号 | 日時（UTC） | きっかけ | コミット |'
            echo '|---|---|---|---|'
            gh run list --workflow publish.yml --branch main --status success --limit 15 \
              --json databaseId,createdAt,event,headSha \
              -q '.[] | select(.event != "pull_request") | "| \(.databaseId) | \(.createdAt) | \(.event) | \(.headSha[0:7]) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          has_bundle() {
            [ -n "$(gh api "repos/$GH_REPO/actions/runs/$1/artifacts" -q '.artifacts[] | select(.name == "site-bundle" and .expired == false) | .id')" ]
          }
          if [ -z "$RUN_ID" ]; then
            for ID in $(gh run list --workflow publish.yml --branch main --status success --limit 30 \
                --json databaseId,event -q '.[] | select(.event != "pull_request") | .databaseId'); do
              if has_bundle "$ID"; then RUN_ID=$ID; break; fi
            done
          fi
          if [ -z "$RUN_ID" ]; then echo "::error::一式が残っている正常な公開が見つかりません（ref に main のコミットや published-pr-b を入れると、そのコミットから戻せます）"; exit 1; fi
          if ! has_bundle "$RUN_ID"; then echo "::error::実行記録 $RUN_ID の一式は、保存期間（7日）を過ぎたか整理されて残っていません（ref にコミットを入れると、そのコミットから戻せます）"; exit 1; fi
          read -r NAME CONC BRANCH EVENT <<< "$(gh run view "$RUN_ID" --json workflowName,conclusion,headBranch,event \
            -q '"\(.workflowName) \(.conclusion) \(.headBranch) \(.event)"')"
          if [ "$NAME" != 公開 ] || [ "$CONC" != success ] || [ "$BRANCH" != main ] || [ "$EVENT" = pull_request ]; then
            echo "::error::実行記録 $RUN_ID は、main の正常な「公開」ではありません（$NAME $CONC $BRANCH $EVENT）"; exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "使う一式: 「公開」の実行記録 $RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: 保存した一式を取り出す（実行記録から）
        if: inputs.ref == ''
        uses: actions/download-artifact@v4
        with:
          name: site-bundle
          path: _site
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 保存したコミットを取り出す（ref から）
        if: inputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: _saved

      - name: そのコミットのファイルを許可リストのとおりに並べる（生成はしない）
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          SITE_ROOT=_saved node tools/site-bundle.mjs _site
          echo "使う一式: $REF（コミット $(git -C _saved rev-parse --short HEAD)）" >> "$GITHUB_STEP_SUMMARY"

      - name: 内部用ファイルの混入がないか確かめ、一式の指紋を記録する
        run: |
          node tools/site-bundle.mjs --verify _site
          FP=$(cd _site && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)
          echo "一式の指紋（全ファイルのsha256）: $FP" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 本番の確認用に一式を渡す（確認に使うだけなので1日で消える）
        uses: actions/upload-artifact@v4
        with:
          name: site-bundle
          path: _site
          retention-days: 1

      - name: 公開用に渡す
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 公開
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    name: 本番の確認
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site-bundle
          path: _site
      - name: 本番が用意した一式になり、内部用ファイルが見えないことを確かめる
        run: node tools/verify-live.mjs _site
