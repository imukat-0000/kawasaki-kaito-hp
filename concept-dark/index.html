<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河﨑海斗 — 試作: 水面の標本箱</title>
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{
  font-family:"Noto Serif JP";
  src:url("../fonts/NotoSerifJP-sub.woff2") format("woff2");
  font-weight:200 900;
  font-display:swap;
}

:root{
  --bg:#F7F4EC;
  --bg-rgb:247,244,236;
  --card:#FFFDF7;
  --ink:#1C1E22;
  --ink-soft:#4C4D48;
  --hido:#9C3B22;
  --hido-deep:#7E2E1A;
  --brass:#9A7B3F;
  --line:#DCD5C6;
  --serif-jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --serif-en:"Didot","Bodoni 72",Georgia,serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}

*{ box-sizing:border-box; }
html, body{ height:100%; overflow:hidden; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); line-height:1.9; -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
::selection{ background:var(--hido); color:#fff; }

.wrap{ max-width:1280px; margin:0 auto; padding-left:clamp(1.4rem,5vw,4rem); padding-right:clamp(1.4rem,5vw,4rem); }

/* ---------- banner ---------- */
.proto-banner{
  position:relative; z-index:21;
  background:var(--hido-deep); color:#fff; font-size:.78rem; letter-spacing:.05em;
  text-align:center; padding:.6em 1em;
}
.proto-banner b{ font-weight:600; }

/* ---------- header ---------- */
header{
  position:fixed; top:2.4rem; left:0; right:0; z-index:20;
  display:flex; justify-content:space-between; align-items:center;
  padding:1.4rem clamp(1.4rem,5vw,4rem);
  mix-blend-mode:normal;
}
.brand{
  font-family:var(--serif-jp); font-size:1rem; letter-spacing:.32em; text-indent:.32em;
  text-decoration:none; color:var(--ink);
}
nav.mainnav ul{ list-style:none; display:flex; gap:2rem; margin:0; padding:0; }
nav.mainnav a{
  text-decoration:none; font-size:.72rem; letter-spacing:.18em; color:var(--ink-soft);
  transition:color .25s ease;
}
nav.mainnav a:hover{ color:var(--hido); }
@media (max-width:700px){
  nav.mainnav{ display:none; }
}

/* ---------- hero ---------- */
.hero{
  position:fixed; inset:0; z-index:1; display:flex; align-items:flex-end;
  padding-top:8rem;
}
.hero-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--bg); touch-action:pan-x; }
.scene-video{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center;
  z-index:1; opacity:0; pointer-events:none;
}
.scene-video--active{ z-index:2; opacity:1; }
.scene-poster{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  background:var(--bg) url('media/poster.jpg') center/cover no-repeat;
  transition:opacity .7s ease;
}
.scene-poster--hidden{ opacity:0; }
.hero-bg::after{
  content:""; position:absolute; inset:0; z-index:4;
  background:linear-gradient(180deg, rgba(var(--bg-rgb),0) 0%, rgba(var(--bg-rgb),.5) 58%, rgba(var(--bg-rgb),.97) 100%);
}
.hero-inner{ position:relative; z-index:1; width:100%; padding-bottom:clamp(3rem,7vw,6rem); }
.hero-eyebrow{
  font-size:.78rem; letter-spacing:.4em; text-indent:.4em; color:var(--brass);
  margin:0 0 1.6rem;
}
.hero-title{
  font-family:var(--serif-jp); font-weight:600; margin:0;
  font-size:clamp(2.8rem,9vw,6.4rem); line-height:1.15; letter-spacing:.04em;
  text-wrap:balance;
}
.hero-en{
  font-family:var(--serif-en); font-style:italic; color:var(--ink-soft);
  font-size:clamp(1rem,2.4vw,1.4rem); margin:1.2rem 0 0; letter-spacing:.02em;
}
.hero-scroll{
  position:absolute; right:clamp(1.4rem,5vw,4rem); bottom:clamp(2.6rem,4vw,4rem); z-index:1;
  font-size:.68rem; letter-spacing:.3em; color:var(--ink-soft);
  writing-mode:vertical-rl;
  background:none; border:0; padding:.4em; cursor:pointer; font-family:inherit;
  transition:color .3s ease;
}
.hero-scroll:hover{ color:var(--brass); }
.hero-scroll--busy{ cursor:progress; color:var(--hido); }
.hero-scroll:focus-visible{ outline:1px solid var(--brass); outline-offset:4px; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ---------- 岩礁ポップアップ（切り替わるたびにセクションをプレビュー） ---------- */
.reef-popup{
  position:absolute; z-index:6;
  left:clamp(1.4rem,5vw,4rem); bottom:clamp(6.5rem,14vw,8.5rem);
  width:min(22rem, calc(100% - clamp(2.8rem,10vw,8rem)));
  background:var(--card); border:1px solid var(--line); border-radius:2px;
  padding:1.6rem 1.8rem 1.7rem;
  box-shadow:0 1.4rem 3rem rgba(28,26,20,.16);
  opacity:0; transform:translateY(14px); pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;
}
.reef-popup--visible{ opacity:1; transform:none; pointer-events:auto; }
.reef-popup-close{
  position:absolute; top:.6rem; right:.7rem; width:1.8rem; height:1.8rem;
  background:none; border:0; color:var(--ink-soft); font-size:1.1rem; line-height:1;
  cursor:pointer; transition:color .25s ease;
}
.reef-popup-close:hover{ color:var(--hido); }
.reef-popup-eyebrow{
  display:block; font-family:var(--serif-en); font-size:.68rem; letter-spacing:.14em;
  color:var(--brass); margin-bottom:.6rem;
}
.reef-popup-title{
  font-family:var(--serif-jp); font-weight:600; font-size:1.15rem; letter-spacing:.06em;
  margin:0 0 .7rem;
}
.reef-popup-body{
  font-size:.86rem; color:var(--ink-soft); line-height:1.85; margin:0 0 1.1rem;
}
.reef-popup-link{
  display:inline-block; font-size:.72rem; letter-spacing:.1em; color:var(--hido);
  text-decoration:none; border-bottom:1px solid var(--hido-deep); padding-bottom:.15em;
  transition:color .25s ease, border-color .25s ease;
}
.reef-popup-link:hover{ color:var(--brass); border-color:var(--brass); }

@media (prefers-reduced-motion:reduce){
  .scene-video{ display:none; }
  .scene-poster{ opacity:1; transition:none; }
  .hero-scroll{ display:none; }
  .reef-popup{ display:none; }
}

/* ---------- hero credit (代替フッター) ---------- */
.hero-credit{
  position:absolute; z-index:5; left:clamp(1.4rem,5vw,4rem); bottom:1.4rem;
  display:flex; gap:1.6rem; align-items:baseline;
  font-size:.68rem; letter-spacing:.06em; color:var(--ink-soft);
}
.hero-credit a{ color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line); }
.hero-credit a:hover{ color:var(--hido); border-color:var(--hido); }
@media (max-width:700px){ .hero-credit{ flex-direction:column; gap:.3rem; } }
</style>
</head>
<body>

<p class="proto-banner"><b>試作案（非公開）</b> — 現行サイトとは別に検討中のビジュアル方向性です。まだ本番には反映されていません。</p>

<header>
  <a class="brand" href="#top">河﨑海斗</a>
  <nav class="mainnav" aria-label="メイン">
    <ul>
      <li><a href="#" data-section="0">コンセプト</a></li>
      <li><a href="#" data-section="1">作品</a></li>
      <li><a href="#" data-section="2">河﨑海斗</a></li>
      <li><a href="#" data-section="3">コンタクト</a></li>
    </ul>
  </nav>
</header>

<main id="top">

  <section class="hero" aria-label="ヒーロー">
    <div class="hero-bg">
      <div class="scene-poster" id="reefPoster" aria-hidden="true"></div>
      <video class="scene-video scene-video--active" id="reefIdle" src="media/goldfish-idle.mp4" poster="media/poster.jpg" muted playsinline loop preload="auto" aria-hidden="true"></video>
      <video class="scene-video" id="reefTransition" src="media/reef-transition.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    </div>
    <div class="wrap hero-inner">
      <p class="hero-eyebrow">KOGEI REALISM</p>
      <h1 class="hero-title">存在の条件を、<br>金属に留める。</h1>
      <p class="hero-en">Kaito Kawasaki — Metal-Casting Artist</p>
    </div>
    <button class="hero-scroll" id="reefScrollCue" type="button" aria-label="次の岩礁へ進む">SCROLL</button>
    <p class="sr-only" id="reefStatus" role="status" aria-live="polite">岩礁の周りを泳いでいます</p>

    <div class="reef-popup" id="reefPopup" role="dialog" aria-label="セクションのプレビュー" hidden>
      <button class="reef-popup-close" id="reefPopupClose" type="button" aria-label="閉じる">×</button>
      <span class="reef-popup-eyebrow" id="reefPopupEyebrow"></span>
      <h3 class="reef-popup-title" id="reefPopupTitle"></h3>
      <p class="reef-popup-body" id="reefPopupBody"></p>
      <a class="reef-popup-link" id="reefPopupLink" href="../index.html#concept"></a>
    </div>

    <div class="hero-credit">
      <span>© <span id="cpyear">2026</span> KAITO KAWASAKI</span>
      <a href="../index.html">現行サイトに戻る →</a>
    </div>
  </section>

</main>

<script>
(function(){
  'use strict';
  var yEl = document.getElementById('cpyear');
  if (yEl) yEl.textContent = new Date().getFullYear();
})();

/* ---------- 金魚スクロールアニメーション（岩礁の入れ替え） ---------- */
(function(){
  'use strict';
  var idleVideo = document.getElementById('reefIdle');
  var transVideo = document.getElementById('reefTransition');
  var poster = document.getElementById('reefPoster');
  var scrollCue = document.getElementById('reefScrollCue');
  var statusEl = document.getElementById('reefStatus');
  if (!idleVideo || !transVideo) return;

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var phase = 'idle';            /* 'idle' | 'transition' */
  var transitionReady = false;   /* reef-transition.mp4 が再生可能か */
  var wheelGesture = false;      /* トラックパッド慣性の1ジェスチャー中フラグ */
  var wheelDelta = 0;
  var wheelReleaseTimer = null;
  var cooldownUntil = 0;         /* 復帰直後の連続トリガー防止 */
  var touchStartY = null;

  var popup = document.getElementById('reefPopup');
  var popupClose = document.getElementById('reefPopupClose');
  var popupEyebrow = document.getElementById('reefPopupEyebrow');
  var popupTitle = document.getElementById('reefPopupTitle');
  var popupBody = document.getElementById('reefPopupBody');
  var popupLink = document.getElementById('reefPopupLink');
  var popupHideTimer = null;
  var popupCycle = 0;
  /* 岩礁が切り替わるたびに、ページの各セクションを順番にプレビュー表示する */
  /* ページ自体はこのヒーロー画面のみで構成されるため、リンク先は本サイトの
     該当セクションを指す(このプロトタイプ内には移動先が存在しない) */
  var SECTIONS = [
    {
      eyebrow: '01 — CONCEPT', title: 'コンセプト', href: '../index.html#concept', linkLabel: 'コンセプトを見る',
      body: '身近に潜む小さな生命の一瞬を見つめ、移ろい続ける自然の記憶を、金属の中に留める。'
    },
    {
      eyebrow: '02 — WORKS', title: '代表作品', href: '../works/', linkLabel: '作品を見る',
      body: '錦鯉、朱色和金、雨ノ蛙「狐の嫁入り」——樹脂に封入された鋳金の作品たち。'
    },
    {
      eyebrow: '03 — ARTIST', title: '河﨑海斗', href: '../index.html#artist', linkLabel: 'プロフィールを見る',
      body: '生命を模倣する作家ではない。生命が立ち上がる場を、工芸によってつくる作家である。'
    },
    {
      eyebrow: '04 — CONTACT', title: 'コンタクト', href: '../index.html#contact', linkLabel: 'コンタクトを見る',
      body: '展覧会・作品・取材・共同プロジェクトに関するお問い合わせは、メールまたはSNSより。'
    }
  ];

  /* index未指定なら自動サイクル(岩礁の切り替わり毎)、指定時はナビクリックからの直接表示 */
  function showPopup(index){
    if (!popup) return;
    var i = (typeof index === 'number') ? index : popupCycle;
    var wrapped = ((i % SECTIONS.length) + SECTIONS.length) % SECTIONS.length;
    var s = SECTIONS[wrapped];
    popupCycle = i + 1;
    if (popupEyebrow) popupEyebrow.textContent = s.eyebrow;
    if (popupTitle) popupTitle.textContent = s.title;
    if (popupBody) popupBody.textContent = s.body;
    if (popupLink) { popupLink.textContent = s.linkLabel + ' →'; popupLink.href = s.href; }
    if (popupHideTimer !== null) window.clearTimeout(popupHideTimer);
    popup.hidden = false;
    window.requestAnimationFrame(function(){ popup.classList.add('reef-popup--visible'); });
  }

  document.querySelectorAll('.mainnav a[data-section]').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      showPopup(parseInt(a.dataset.section, 10));
    });
  });
  function hidePopup(){
    if (!popup) return;
    popup.classList.remove('reef-popup--visible');
    if (popupHideTimer !== null) window.clearTimeout(popupHideTimer);
    popupHideTimer = window.setTimeout(function(){ popup.hidden = true; popupHideTimer = null; }, 450);
  }
  if (popupClose) popupClose.addEventListener('click', hidePopup);
  if (popupLink) popupLink.addEventListener('click', hidePopup);
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && popup && !popup.hidden) hidePopup();
  });

  function play(video){
    if (!video) return;
    var p = video.play();
    if (p && typeof p.catch === 'function') p.catch(function(){ /* 次のジェスチャーで再試行される */ });
  }
  function resetHidden(video){
    if (!video) return;
    video.pause();
    try { video.currentTime = 0; } catch (e) { /* noop */ }
  }
  function setPhase(next){
    phase = next;
    idleVideo.classList.toggle('scene-video--active', next === 'idle');
    transVideo.classList.toggle('scene-video--active', next === 'transition');
    if (scrollCue) {
      scrollCue.textContent = next === 'idle' ? 'SCROLL' : 'SWIMMING';
      scrollCue.classList.toggle('hero-scroll--busy', next !== 'idle');
      scrollCue.disabled = reducedMotion || next !== 'idle';
    }
    if (statusEl) statusEl.textContent = next === 'idle' ? '岩礁の周りを泳いでいます' : '新しい岩礁へ向かっています';
  }
  /* ヒーローが画面の最上部にある間だけ、スクロール操作を岩礁の入れ替えとして扱う */
  function atHero(){
    return window.scrollY <= 2;
  }
  function beginTransition(){
    if (reducedMotion || phase !== 'idle' || !transitionReady || performance.now() < cooldownUntil || !atHero()) return;
    hidePopup();
    idleVideo.pause();
    play(transVideo);
    setPhase('transition');
    window.requestAnimationFrame(function(){ resetHidden(idleVideo); });
  }
  function finishTransition(){
    play(idleVideo);
    setPhase('idle');
    cooldownUntil = performance.now() + 700;
    window.requestAnimationFrame(function(){ resetHidden(transVideo); });
    /* 岩礁が新しい定位に落ち着いた瞬間、そのサイクルに対応するセクションをプレビュー表示する */
    showPopup();
  }

  idleVideo.addEventListener('canplay', function(){
    if (poster) poster.classList.add('scene-poster--hidden');
  });
  transVideo.addEventListener('canplay', function(){ transitionReady = true; });
  transVideo.addEventListener('ended', finishTransition);

  if (reducedMotion) {
    if (poster) poster.classList.remove('scene-poster--hidden');
  } else {
    play(idleVideo);
  }

  function releaseWheelGesture(){
    wheelGesture = false;
    wheelDelta = 0;
    wheelReleaseTimer = null;
  }
  function onWheel(e){
    if (reducedMotion || !atHero()) return;
    if (e.deltaY <= 0) return;
    e.preventDefault();
    if (wheelReleaseTimer !== null) window.clearTimeout(wheelReleaseTimer);
    wheelReleaseTimer = window.setTimeout(releaseWheelGesture, 280);
    if (wheelGesture) return;
    wheelDelta += e.deltaY;
    if (wheelDelta < 72) return;
    wheelGesture = true;
    wheelDelta = 0;
    beginTransition();
  }
  function onTouchStart(e){
    touchStartY = (atHero() && e.touches[0]) ? e.touches[0].clientY : null;
  }
  function onTouchMove(e){
    /* ヒーロー内では縦スワイプでページ自体をスクロールさせず、岩礁の入れ替え判定に使う */
    if (atHero() && !reducedMotion) e.preventDefault();
  }
  function onTouchEnd(e){
    var start = touchStartY;
    touchStartY = null;
    if (start === null || reducedMotion || !atHero()) return;
    var touch = e.changedTouches[0];
    var end = touch ? touch.clientY : undefined;
    if (end !== undefined && start - end > 42) beginTransition();
  }
  function onKeyDown(e){
    if (reducedMotion || e.repeat || !atHero()) return;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      beginTransition();
    }
  }

  window.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('touchstart', onTouchStart, { passive: true });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, { passive: true });
  window.addEventListener('keydown', onKeyDown);
  if (scrollCue) scrollCue.addEventListener('click', beginTransition);
})();
</script>

</body>
</html>
