/* ============ tokens（本体 index.html と同一） ============ */
:root{

}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#14171C; --ink:#E9E4D9; --ink-soft:#ABABA1;
    --hido:#CE6A4A; --hido-deep:#E08767; --brass:#C2A05C;
    --line:#2B3037; --card:#1B1F25;
  }
}
:root[data-theme="light"]{
  --paper:#F7F4EC; --ink:#1C1E22; --ink-soft:#4C4D48;
  --hido:#9C3B22; --hido-deep:#7E2E1A; --brass:#9A7B3F;
  --line:#DCD5C6; --card:#FFFDF7;
}
:root[data-theme="dark"]{
  --paper:#14171C; --ink:#E9E4D9; --ink-soft:#ABABA1;
  --hido:#CE6A4A; --hido-deep:#E08767; --brass:#C2A05C;
  --line:#2B3037; --card:#1B1F25;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; background:var(--paper); }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";
  line-height:1.9;
  letter-spacing:0.04em;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--hido); outline-offset:3px; }
.skip-link{
  position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden;
  z-index:100; background:var(--paper); color:var(--ink); padding:.8em 1.4em;
  border:1px solid var(--hido); border-radius:.2rem; font-size:.85rem; text-decoration:none;
}
.skip-link:focus{ left:1rem; top:1rem; width:auto; height:auto; overflow:visible; }
.mincho{ font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; }

/* ============ nav（本体と共通） ============ */
/* nav はheaderの兄弟要素（headerのbackdrop-filterがposition:fixedの containing block に
   なってしまい、モバイル全画面オーバーレイがheaderの高さ内に閉じ込められるのを防ぐため） */
header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:1.6rem clamp(1.2rem, 4vw, 3rem);
  background:color-mix(in srgb, var(--paper) 84%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);
  transition:opacity .35s ease, transform .35s ease;
}
.brand{
  display:flex; flex-direction:column; gap:.6rem;
  text-decoration:none; position:relative; z-index:26;
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:1.05rem; letter-spacing:.3em; font-weight:600;
}
.brand-tagline{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:.6rem; letter-spacing:.1em; line-height:1.6; font-weight:400;
  color:var(--ink-soft);
}
#mainNav{
  position:fixed; top:0; height:7.75rem; right:clamp(1.2rem, 4vw, 3rem); z-index:31;
  display:flex; align-items:center;
  transition:opacity .35s ease;
}
#mainNav ul{ display:flex; flex-direction:row; align-items:center; gap:1.8rem; list-style:none; min-width:0; }
#mainNav ul li{ min-width:0; }
#mainNav a{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  text-decoration:none; font-size:.85rem; letter-spacing:.08em;
  color:var(--ink-soft); transition:color .25s;
}
#mainNav a:hover, #mainNav a[aria-current]{ color:var(--hido); }

.nav-toggle{
  display:none; position:relative; z-index:26;
  flex-direction:column; align-items:center; justify-content:center; gap:5px;
  width:2.4rem; height:2.4rem; background:none; border:0; cursor:pointer; padding:0;
}
.nav-toggle span{
  display:block; width:1.4rem; height:1.5px; background:var(--ink);
  transition:transform .25s ease, opacity .2s ease;
}
body.nav-open .nav-toggle span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
body.nav-open .nav-toggle span:nth-child(2){ opacity:0; }
body.nav-open .nav-toggle span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

.nav-sns{ display:none; }

/* メニュー9項目を横一列に並べるとロゴに重なる幅（タブレットを含む）では、ハンバーガーメニューにする */
@media (max-width:1100px){
  .nav-toggle{ display:flex; }
  #mainNav{
    inset:0; right:auto; z-index:24;
    width:100%; height:100%; align-items:center;
    /* 上は固定ヘッダーの高さ(7.75rem)＋余白、下はInstagram・Xの行の分をあける。
       収まらない画面ではメニューの中だけがスクロールする */
    padding:8.75rem clamp(1.4rem,8vw,4rem) 4.8rem;
    overflow-y:auto; overscroll-behavior:contain;
    background:var(--paper);
    justify-content:flex-end;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  body.nav-open #mainNav{ opacity:1; visibility:visible; }
  /* margin:auto で余白があるときは上下中央、足りないときは上端からはみ出さずに並べる */
  #mainNav ul{ flex-direction:column; align-items:flex-end; gap:clamp(.7rem, 2.6vh, 1.6rem); margin:auto 0; }
  /* 文字の大きさと間隔は画面の高さに合わせて縮め、9項目が1画面に収まるようにする */
  #mainNav li{ line-height:1.35; }
  #mainNav a{ font-size:clamp(1.05rem, 2.9vh, 1.5rem); letter-spacing:.1em; }

  .nav-sns{
    display:flex; gap:1.4rem;
    position:fixed; left:1.4rem; bottom:1.8rem; z-index:25;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  body.nav-open .nav-sns{ opacity:1; visibility:visible; }
  .nav-sns a{
    font-size:.72rem; letter-spacing:.14em; color:var(--ink-soft); text-decoration:none;
  }
  .nav-sns a:hover{ color:var(--hido); }
}

/* 横向きのスマートフォンなど高さが低い画面：項目を3列に並べて1画面に収める */
@media (max-width:1100px) and (max-height:520px){
  #mainNav ul{ display:grid; grid-template-columns:repeat(3, auto); justify-items:end; gap:.8rem 2rem; }
}

main{ position:relative; z-index:1; padding-top:9rem; }
section{ padding:clamp(2rem,5vw,3.6rem) clamp(1.4rem,6vw,5rem); }

.sec-head{ display:flex; align-items:baseline; gap:1.4rem; margin-bottom:2.2rem; }
.sec-head h1{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:clamp(1.5rem,3.2vw,2.1rem); font-weight:600; letter-spacing:.2em;
  white-space:nowrap;
}
.sec-head span{ font-size:.72rem; letter-spacing:.34em; color:var(--hido); min-width:0; overflow-wrap:break-word; }
.sec-head::after{ content:""; flex:1; height:1px; background:var(--line); }

.archive-back{ font-size:.8rem; }
.archive-back a{
  color:var(--hido); text-decoration:none;
  border-bottom:1px solid color-mix(in srgb, var(--hido) 45%, transparent);
  padding-bottom:.1em; transition:border-color .25s;
}
.archive-back a:hover{ border-color:var(--hido); }

/* ============ ジャーナル（ブログ風・一覧と記事で共通） ============ */
/* 方眼ノートのような点の地紋。作家の手帳をのぞくような親しみを出す */
body{
  background-image:radial-gradient(color-mix(in srgb, var(--line) 75%, transparent) 1px, transparent 1.2px);
  background-size:22px 22px;
}
.jr-avatar{
  flex:none; width:3.4rem; height:3.4rem; border-radius:50%; overflow:hidden;
  border:2px solid var(--card); box-shadow:0 0 0 2px color-mix(in srgb, var(--hido) 35%, transparent);
  background:var(--card);
}
.jr-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.journal-cat{
  display:inline-block; font-size:.68rem; letter-spacing:.14em; line-height:1.6; color:var(--hido);
  background:color-mix(in srgb, var(--hido) 11%, var(--card));
  border-radius:999px; padding:.3em 1em;
}
.journal-cat::before{ content:"● "; font-size:.6em; vertical-align:.2em; opacity:.7; }
.journal-date{
  font-size:.74rem; letter-spacing:.06em; color:var(--ink-soft); font-variant-numeric:tabular-nums;
}
/* マスキングテープ風の留め具（写真の上の角に貼る） */
.jr-photo{ position:relative; }
.jr-photo::before, .jr-photo::after{
  content:""; position:absolute; z-index:2; top:-.7rem; width:5.2rem; height:1.5rem;
  background:color-mix(in srgb, var(--hido) 26%, transparent);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  pointer-events:none;
}
.jr-photo::before{ left:1.2rem; transform:rotate(-6deg); }
.jr-photo::after{ right:1.2rem; transform:rotate(5deg); background:color-mix(in srgb, var(--brass) 28%, transparent); }
.jr-btn{
  display:inline-flex; align-items:center; gap:.4em;
  font-size:.8rem; letter-spacing:.06em; text-decoration:none;
  color:var(--hido); background:var(--card);
  border:1.5px solid color-mix(in srgb, var(--hido) 40%, transparent);
  border-radius:999px; padding:.55em 1.3em;
  transition:background .25s, color .25s, border-color .25s, transform .25s;
}
.jr-btn:hover{ background:var(--hido); color:var(--card); border-color:var(--hido); transform:translateY(-2px); }
@media (prefers-reduced-motion:reduce){
  .jr-btn, .jr-card{ transition:none !important; }
  .jr-btn:hover, .jr-card:hover{ transform:none !important; }
}

/* ---------- 一覧 ---------- */
.jr-hello{
  display:flex; align-items:center; gap:1.1rem;
  max-width:52rem; margin:1.8rem 0 2.8rem; padding:1.2rem 1.4rem;
  background:var(--card); border-radius:1.2rem;
  border:1px solid var(--line);
  box-shadow:0 6px 20px -14px rgba(60,40,20,.35);
}
.jr-hello-name{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:600; font-size:.98rem; letter-spacing:.12em; line-height:1.5;
}
.jr-hello-name small{
  display:block; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-weight:400; font-size:.66rem; letter-spacing:.1em; color:var(--ink-soft);
}
.journal-lede{ color:var(--ink-soft); font-size:.88rem; line-height:1.85; margin-top:.35rem; }

.journal-list{
  list-style:none; max-width:60rem;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
  gap:2.6rem 2rem; padding-top:.6rem;
}
.jr-card{
  display:flex; flex-direction:column; height:100%;
  text-decoration:none; color:inherit;
  background:var(--card); border-radius:1.2rem; padding:.8rem .8rem 1.4rem;
  border:1px solid var(--line);
  box-shadow:0 8px 24px -16px rgba(60,40,20,.4);
  transition:transform .3s ease, box-shadow .3s ease;
}
.jr-card:hover{ transform:translateY(-4px) rotate(-.4deg); box-shadow:0 16px 30px -18px rgba(60,40,20,.5); }
.jr-card .jr-photo{ aspect-ratio:3/2; }
.jr-card .jr-photo img{
  width:100%; height:100%; object-fit:cover; display:block; border-radius:.8rem;
}
/* 日付スタンプ（写真の右下に重ねる） */
.jr-stamp{
  position:absolute; right:.8rem; bottom:-1.2rem; z-index:3;
  width:3.9rem; height:3.9rem; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--hido); color:var(--card);
  border:3px solid var(--card);
  font-variant-numeric:tabular-nums; line-height:1.15; transform:rotate(8deg);
}
.jr-stamp b{ font-family:"Didot","Bodoni 72","Bodoni Moda",serif; font-size:1.02rem; font-weight:600; letter-spacing:.02em; }
.jr-stamp small{ font-size:.56rem; letter-spacing:.1em; opacity:.9; }
.jr-card-body{ display:flex; flex-direction:column; flex:1; padding:1.3rem .7rem 0; }
.jr-card .journal-meta{ display:flex; align-items:center; gap:.8em; margin-bottom:.7em; }
.journal-title{
  display:block; font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:600; font-size:1.08rem; line-height:1.6; margin-bottom:.6em; transition:color .25s;
}
.jr-card:hover .journal-title{ color:var(--hido); }
.journal-excerpt{ font-size:.84rem; line-height:1.85; color:var(--ink-soft); flex:1; }
.jr-more{ align-self:flex-end; margin-top:1rem; font-size:.76rem; letter-spacing:.1em; color:var(--hido); }
.jr-more::after{ content:" →"; display:inline-block; transition:transform .25s; }
.jr-card:hover .jr-more::after{ transform:translateX(3px); }
@media (max-width:520px){
  .jr-hello{ align-items:flex-start; padding:1.1rem 1.1rem; }
}

footer{
  padding:2.5rem; text-align:center;
  font-size:.7rem; letter-spacing:.3em; color:var(--ink-soft);
  border-top:1px solid var(--line);
}
.footer-links{ margin-bottom:.8em; }
.footer-links a{
  color:var(--ink-soft); text-decoration:none; font-size:.7rem; letter-spacing:.15em;
  border-bottom:1px solid transparent; transition:border-color .25s, color .25s;
}
.footer-links a:hover{ color:var(--hido); border-color:var(--hido); }

      document.body.style.overflow = '';
    };
    var toggleNav = function(){
      var open = document.body.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      var isMobileNav = window.matchMedia('(max-width:1100px)').matches;
      document.body.style.overflow = (open && isMobileNav) ? 'hidden' : '';
    };
    navToggle.addEventListener('click', toggleNav);
    mainNav.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', closeNav);
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeNav();
    });
  }

  /* ---------- スクロール方向でヘッダーを隠す/出す ---------- */
  (function(){
    var headerEl = document.querySelector('header');
    var navEl = document.getElementById('mainNav');
    if (!headerEl) return;
    var lastY = window.scrollY;
    var hideThreshold = 80;
    var hidden = false;
    var ticking = false;
    function setHidden(next){
      if (next === hidden) return;
      hidden = next;
      if (hidden){
        headerEl.style.opacity = '0';
        headerEl.style.transform = 'translateY(-100%)';
        headerEl.style.pointerEvents = 'none';
        if (navEl){ navEl.style.opacity = '0'; navEl.style.pointerEvents = 'none'; }
      } else {
        headerEl.style.opacity = '';
        headerEl.style.transform = '';
        headerEl.style.pointerEvents = '';
        if (navEl){ navEl.style.opacity = ''; navEl.style.pointerEvents = ''; }
      }
    }
    function update(){
      var currentY = window.scrollY;
      if (!document.body.classList.contains('nav-open')){
        if (currentY <= hideThreshold){
          setHidden(false);
        } else if (currentY > lastY){
          setHidden(true);
        } else if (currentY < lastY){
          setHidden(false);
        }
      }
      lastY = currentY;
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if (!ticking){
        requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
  })();

  /* ©年の自動更新 */
  var yEl = document.getElementById('cpyear');
  if (yEl){
    var y = new Date().getFullYear();
    if (y > 2026) yEl.textContent = "2026–" + y;
  }
})();
</script>
