  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--hido); outline-offset:3px; }
.mincho{ font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; }

/* ============ nav（本体と共通） ============ */
/* nav はheaderの兄弟要素（headerのbackdrop-filterがposition:fixedの containing block に
   なってしまい、モバイル全画面オーバーレイがheaderの高さ内に閉じ込められるのを防ぐため） */
header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:1.6rem clamp(1.2rem, 4vw, 3rem);
  background:color-mix(in srgb, var(--paper) 84%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);
  transition:opacity .35s ease, transform .35s ease;
}
.brand{
  display:flex; flex-direction:column; gap:.6rem;
  text-decoration:none; position:relative; z-index:26;
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:1.05rem; letter-spacing:.3em; font-weight:600;
}
.brand-tagline{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:.6rem; letter-spacing:.1em; line-height:1.6; font-weight:400;
  color:var(--ink-soft);
}
#mainNav{
  position:fixed; top:0; height:7.75rem; right:clamp(1.2rem, 4vw, 3rem); z-index:31;
  display:flex; align-items:center;
  transition:opacity .35s ease;
}
#mainNav ul{ display:flex; flex-direction:row; align-items:center; gap:1.8rem; list-style:none; }
#mainNav a{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  text-decoration:none; font-size:.85rem; letter-spacing:.08em;
  color:var(--ink-soft); transition:color .25s;
}
#mainNav a:hover, #mainNav a[aria-current]{ color:var(--hido); }

.nav-toggle{
  display:none; position:relative; z-index:26;
  flex-direction:column; align-items:center; justify-content:center; gap:5px;
  width:2.4rem; height:2.4rem; background:none; border:0; cursor:pointer; padding:0;
}
.nav-toggle span{
  display:block; width:1.4rem; height:1.5px; background:var(--ink);
  transition:transform .25s ease, opacity .2s ease;
}
body.nav-open .nav-toggle span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
body.nav-open .nav-toggle span:nth-child(2){ opacity:0; }
body.nav-open .nav-toggle span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

.nav-sns{ display:none; }

@media (max-width:760px){
  .nav-toggle{ display:flex; }
  #mainNav{
    inset:0; right:auto; z-index:24;
    width:100%; height:100%; padding:0 clamp(1.4rem,8vw,4rem); align-items:center;
    background:var(--paper);
    justify-content:flex-end;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  body.nav-open #mainNav{ opacity:1; visibility:visible; }
  #mainNav ul{ flex-direction:column; align-items:flex-end; gap:1.8rem; }
  #mainNav a{ font-size:1.5rem; letter-spacing:.1em; }

  .nav-sns{
    display:flex; gap:1.4rem;
    position:fixed; left:1.4rem; bottom:1.8rem; z-index:25;
    opacity:0; visibility:hidden; transition:opacity .3s ease;
  }
  body.nav-open .nav-sns{ opacity:1; visibility:visible; }
  .nav-sns a{
    font-size:.72rem; letter-spacing:.14em; color:var(--ink-soft); text-decoration:none;
  }
  .nav-sns a:hover{ color:var(--hido); }
}

main{ position:relative; z-index:1; padding-top:9rem; }
section{ padding:clamp(2rem,5vw,3.6rem) clamp(1.4rem,6vw,5rem); }

.sec-head{ display:flex; align-items:baseline; gap:1.4rem; margin-bottom:2.2rem; }
.sec-head h2{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:clamp(1.5rem,3.2vw,2.1rem); font-weight:600; letter-spacing:.2em;
  white-space:nowrap;
}
.sec-head span{ font-size:.72rem; letter-spacing:.34em; color:var(--hido); }
.sec-head::after{ content:""; flex:1; height:1px; background:var(--line); }

.archive-back{ font-size:.8rem; }
.archive-back a{
  color:var(--hido); text-decoration:none;
  border-bottom:1px solid color-mix(in srgb, var(--hido) 45%, transparent);
  padding-bottom:.1em; transition:border-color .25s;
}
.archive-back a:hover{ border-color:var(--hido); }

/* ============ 年別グリッド ============ */
.archive-year{ margin-bottom:clamp(2.6rem,6vw,4rem); }
.year-head{ display:flex; align-items:baseline; gap:1.1rem; margin-bottom:1.5rem; }
.year-head .year-num{
  font-family:"Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  font-size:clamp(1.5rem,3vw,2rem); color:var(--hido); letter-spacing:.05em;
}
.year-head .year-line{ flex:1; height:1px; background:var(--line); }

.archive-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:1.1rem;
}
.archive-tile{
  appearance:none; border:1px solid var(--line); background:var(--card);
  border-radius:2px; padding:0; cursor:pointer; text-align:left; font:inherit; color:inherit;
  display:flex; flex-direction:column; overflow:hidden;
  transition:border-color .25s ease, transform .25s ease;
}
.archive-tile:hover, .archive-tile:focus-visible{ border-color:var(--hido); transform:translateY(-3px); }
.tile-visual{
  aspect-ratio:1/1; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(90% 130% at 50% 120%, color-mix(in srgb, var(--hido) 22%, transparent) 0%, transparent 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--ink) 6%, var(--card)), var(--card));
  border-bottom:1px solid var(--line);
}
.tile-visual .kanji{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:2.5rem; font-weight:600; color:color-mix(in srgb, var(--hido) 78%, var(--ink));
}
.tile-visual img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(var(--zoom,1)); }
.tile-meta{ padding:.65rem .75rem .8rem; }
.tile-title{
  display:block; font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:.88rem; font-weight:600; letter-spacing:.05em;
}
.tile-note{ display:block; font-size:.65rem; color:var(--ink-soft); letter-spacing:.08em; margin-top:.2rem; }

/* ============ モーダル ============ */
.work-modal{
  position:fixed; inset:0; z-index:60;
  display:flex; align-items:center; justify-content:center; padding:1.4rem;
  opacity:0; visibility:hidden; transition:opacity .25s ease;
}
.work-modal.open{ opacity:1; visibility:visible; }
.work-modal-backdrop{
  position:absolute; inset:0;
  background:color-mix(in srgb, var(--ink) 55%, transparent);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.work-modal-panel{
  position:relative; z-index:1; width:100%; max-width:640px; max-height:88vh; overflow:auto;
  background:var(--card); border:1px solid var(--line); border-radius:3px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
  transform:translateY(12px); transition:transform .25s ease;
}
.work-modal.open .work-modal-panel{ transform:none; }
@media (min-width:640px){
  .work-modal-panel{ max-width:820px; display:grid; grid-template-columns:1fr 1fr; }
}
.work-modal-close{
  position:absolute; top:.6rem; right:.6rem; z-index:2;
  width:2.2rem; height:2.2rem; border-radius:50%;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  font-size:1.05rem; line-height:1; cursor:pointer;
}
.work-modal-close:hover{ border-color:var(--hido); color:var(--hido); }
.work-modal-visual{
  aspect-ratio:1/1; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(90% 130% at 50% 120%, color-mix(in srgb, var(--hido) 22%, transparent) 0%, transparent 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--ink) 6%, var(--card)), var(--card));
}
.work-modal-visual .kanji{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:5rem; font-weight:600; color:color-mix(in srgb, var(--hido) 78%, var(--ink));
}
.work-modal-visual img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(var(--zoom,1)); }
.work-modal-body{ padding:1.6rem 1.6rem 1.8rem; display:flex; flex-direction:column; gap:.8rem; }
.work-modal-body h3{
  font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:1.2rem; font-weight:600; letter-spacing:.06em;
}
.work-modal-body h3 small{ font-weight:400; font-size:.72rem; color:var(--ink-soft); margin-left:.6em; letter-spacing:.1em; }
.modal-sub{ font-size:.72rem; color:var(--ink-soft); letter-spacing:.1em; margin-top:-.4rem; }
.work-award{
  font-size:.7rem; letter-spacing:.12em; color:var(--hido);
  border:1px solid color-mix(in srgb, var(--hido) 45%, transparent);
  border-radius:999px; padding:.15em .9em; align-self:flex-start;
}
.work-modal-body p{ font-size:.87rem; line-height:1.9; }
.work-specs{ margin-top:auto; font-size:.75rem; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:.7rem; }
.work-specs div{ display:flex; gap:.8em; }
.work-specs dt{ min-width:3.5em; letter-spacing:.1em; }

footer{
  padding:2.5rem; text-align:center;
  font-size:.7rem; letter-spacing:.3em; color:var(--ink-soft);
  border-top:1px solid var(--line);
}

(function(){

  /* ---------- ハンバーガーメニュー ---------- */
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  if (navToggle && mainNav){
    var closeNav = function(){
      document.body.classList.remove('nav-open');
      navToggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    };
    var toggleNav = function(){
      var open = document.body.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      var isMobileNav = window.matchMedia('(max-width:760px)').matches;
      document.body.style.overflow = (open && isMobileNav) ? 'hidden' : '';
    };
    navToggle.addEventListener('click', toggleNav);
    mainNav.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', closeNav);
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeNav();
    });
  }

  /* ---------- スクロール方向でヘッダーを隠す/出す ---------- */
  (function(){
    var headerEl = document.querySelector('header');
    var navEl = document.getElementById('mainNav');
    if (!headerEl) return;
    var lastY = window.scrollY;
    var hideThreshold = 80;
    var hidden = false;
    var ticking = false;
    function setHidden(next){
      if (next === hidden) return;
      hidden = next;
      if (hidden){
        headerEl.style.opacity = '0';
        headerEl.style.transform = 'translateY(-100%)';
        headerEl.style.pointerEvents = 'none';
        if (navEl){ navEl.style.opacity = '0'; navEl.style.pointerEvents = 'none'; }
      } else {
        headerEl.style.opacity = '';
        headerEl.style.transform = '';
        headerEl.style.pointerEvents = '';
        if (navEl){ navEl.style.opacity = ''; navEl.style.pointerEvents = ''; }
      }
    }
    function update(){
      var currentY = window.scrollY;
      if (!document.body.classList.contains('nav-open')){
        if (currentY <= hideThreshold){
          setHidden(false);
        } else if (currentY > lastY){
          setHidden(true);
        } else if (currentY < lastY){
          setHidden(false);
        }
      }
      lastY = currentY;
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if (!ticking){
        requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
  })();

    { id:"w14", title:"朱色水泡眼", year:2025, motif:"金魚（水泡眼）", desc:"目の下に膨らむ水泡は、水そのものではなく、水を模した透明の重さ。朱色は、その重さを支える体の側にだけ宿る。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入"]], kanji:"朱", img:"../img/work_w14.jpg", alt:"朱色水泡眼", pos:"51% 70%" },
    { id:"w15", title:"朱色珍珠鱗", year:2025, motif:"金魚（珍珠鱗）", desc:"一枚一枚が真珠のように盛り上がる鱗に、朱色が粒ごと擦り込まれていく。均一な赤ではなく、粒の数だけの赤がある。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入"]], kanji:"朱", img:"../img/work_w15.jpg", alt:"朱色珍珠鱗", pos:"50% 50%" },
    { id:"w16", title:"朱色蘭鋳", year:2025, motif:"金魚（蘭鋳）", desc:"背びれを持たない蘭鋳は、水面に対して丸みだけで泳ぐ。朱色は、その丸みの起伏に沿って濃淡を変える。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入"]], kanji:"朱", img:"../img/work_w16.jpg", alt:"朱色蘭鋳", pos:"56% 50%" },
    { id:"w17", title:"朱色蝶尾", year:2025, en:"Shuiro Chobi", motif:"金魚（蝶尾）", desc:"蝶のように大きく開く尾びれに、梨地の粗さと磨きの滑らかさが同居する。朱色は、その質感の違いを一つの赤で結ぶ。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・梨地・磨き・第一酸化銅の擦り付け・樹脂封入"]], kanji:"朱", img:"../img/work_w17.jpg", alt:"朱色蝶尾", pos:"50% 50%", zoom:"1.09" },
    { id:"w18", title:"朱色頂天眼", year:2025, motif:"金魚（頂天眼）", desc:"上を向いた眼のまま泳ぐ頂天眼は、前方を見ない。朱色は、見えない前方の代わりに、体の輪郭だけを強く照らす。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入"]], kanji:"朱", img:"../img/work_w18.jpg", alt:"朱色頂天眼", pos:"50% 50%" },
    { id:"gakkyo-kaeru", title:"画狂乃蛙", year:2025, yearLabel:"2025〜2026", motif:"カエル（葛飾北斎「蛙とゆきのした」をモチーフ）", desc:"葛飾北斎「蛙とゆきのした」に描かれた蛙を、北斎と同じ江戸時代の技法で立体に起こす。タイトルは北斎の号「画狂人」との掛け言葉。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂封入・樹脂コーティング"],["展示","北斎館 個展（2026年9月3日〜）予定"],["価格","¥200,000（北斎館オンラインショップで販売中）"]], kanji:"狂", img:"../img/work_gakkyo-kaeru.jpg", alt:"画狂乃蛙", pos:"52% 22%" },
    { id:"w19", title:"白和金", year:2025, motif:"金魚（和金）", desc:"色を足すのではなく、酸化を止めることで白は生まれる。銀メッキは、赤に至る前の金魚を、そのまま光の色に留める。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・銀メッキ・樹脂封入"]], kanji:"白", img:"../img/work_w19.jpg", alt:"白和金", pos:"0% 49%" },
    { id:"w20", title:"白蘭鋳", year:2025, motif:"金魚（蘭鋳）", desc:"丸い体に酸化の影を持たない蘭鋳は、輪郭だけで存在を示す。白は、色というより、色の不在として置かれている。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・銀メッキ・樹脂封入"]], kanji:"白", img:"../img/work_w20.jpg", alt:"白蘭鋳", pos:"50% 50%" },
    { id:"w21", title:"白蝶尾", year:2025, motif:"金魚（蝶尾）", desc:"尾びれの薄さは、真鍮粉と銀メッキ、異なる金属の粉が重ならないことで保たれる。白は、その薄さがそのまま光ることの結果である。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・真鍮粉の擦り付け・銀メッキ・樹脂封入"]], kanji:"白", img:"../img/work_w21.jpg", alt:"白蝶尾", pos:"50% 50%" },
    { id:"kouyou", title:"紅葉", year:2025, en:"Autumn Leaves", motif:"植物（紅葉の葉）", award:"第20回 藝大アートプラザ・アートアワード 入選", desc:"純銅を紅葉の形に鋳造し、緋銅で赤く染めた。葉が色づく秋の一瞬という時間が、金属の中に留められている。", specs:[["素材","銅"],["技法","真空加圧鋳造法・石膏型・緋銅酸化・樹脂コーティング"],["展示","第20回 藝大アートプラザ・アートアワード展（2026年）<br>河﨑海斗展／新宿髙島屋（2026年7月22日〜28日）予定<br>工芸リアリズム（冊子表紙・掲載）"]], img:"../img/work_kouyou.jpg", alt:"紅葉 — 緋銅で赤く染めた鋳金の紅葉" },
    { id:"w22", title:"茶銀蟇蛙", year:2025, motif:"ヒキガエル", desc:"ヒキガエルの重さは、跳ぶためでなく留まるためにある。硫化がつくる茶と銀メッキの光は、その留まる体の表面で分け合われている。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], kanji:"蟇", img:"../img/work_w22.jpg", alt:"茶銀蟇蛙", pos:"50% 50%" },
    { id:"w23", title:"茶銀雨ノ蛙", year:2025, motif:"カエル", desc:"雨に濡れた体は、乾いた体より重く見える。硫化の茶と銀の光が、その錯覚をそのまま金属の重さとして固定する。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], kanji:"茶", img:"../img/work_w23.jpg", alt:"茶銀雨ノ蛙", pos:"50% 50%" },
    { id:"w24", title:"銀水玉珍珠鱗", year:2025, motif:"金魚（珍珠鱗）", desc:"珍珠鱗の粒立ちに、水玉という別の模様が重ねられる。銀メッキは、粒と水玉、二つの丸みを同じ光で結ぶ。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂封入"]], kanji:"銀", img:"../img/work_w24.jpg", alt:"銀水玉珍珠鱗", pos:"22% 41%" },
    { id:"w25", title:"銀黒頂天眼", year:2025, motif:"金魚（頂天眼）", desc:"銅ではなく錫を選んだ地金に、硫化の黒が乗る。銀と黒の境界は、上を向く眼と同じく、はっきりと分かたれている。", specs:[["素材","銀・錫・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・樹脂封入"]], kanji:"銀", img:"../img/work_w25.jpg", alt:"銀黒頂天眼", pos:"50% 50%" },
    { id:"w26", title:"雨ノ蛙「夜雨」", year:2025, motif:"カエル", desc:"夜に降る雨は、色を見せずに音だけを残す。緑青と硫化が同時に進む体表は、見えない夜の湿度をそのまま帯びている。", specs:[["素材","銀・錫・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・緑青酸化・硫化・樹脂コーティング"]], img:"../img/work_w26.jpg", alt:"雨ノ蛙「夜雨」", pos:"50% 50%" },
    { id:"ame-kaeru", title:"雨ノ蛙「狐の嫁入り」", year:2025, en:"Rain Frog: The Fox's Wedding", motif:"カエル", desc:"ガラス、光、色、背景。その条件のなかで、カエルは別の存在として立ち上がる。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], kanji:"雨", img:"../img/work_ame-kaeru.jpg", alt:"雨ノ蛙「狐の嫁入り」", pos:"50% 50%" },
    { id:"w27", title:"雨ノ蛙「白雨」", year:2025, motif:"カエル", desc:"白雨は、降り始めてすぐに止む雨。銀メッキの明るさと硫化の翳り、短い時間に起きる二つの変化が体表に同居する。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], img:"../img/work_w27.jpg", alt:"雨ノ蛙「白雨」", pos:"50% 50%" },
    { id:"w28", title:"雨ノ蛙「積雨」", year:2025, motif:"カエル", desc:"幾度も降り積もるように、雨は同じ場所へ繰り返し落ちる。硫化がゆっくり這う体表は、その繰り返しの跡をそのまま写している。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], img:"../img/work_w28.jpg", alt:"雨ノ蛙「積雨」", pos:"50% 50%" },
    { id:"w29", title:"雨ノ蛙「翠雨」", year:2025, motif:"カエル", desc:"翠雨は、青葉を通り抜けてから落ちる雨。緑青の色は、葉の緑を吸い込んだ後の雨粒の色として体表に残る。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・緑青酸化・銀メッキ・樹脂コーティング"]], img:"../img/work_w29.jpg", alt:"雨ノ蛙「翠雨」", pos:"50% 50%" },
    { id:"w30", title:"雨ノ蛙「青葉雨」", year:2025, motif:"カエル", desc:"青葉のあいだを抜けて落ちる雨は、葉の匂いだけを含んで地表に届く。緑青の色は、その匂いを吸い込んだ跡のようにも見える。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・緑青酸化・銀メッキ・樹脂コーティング"]], img:"../img/work_w30.jpg", alt:"雨ノ蛙「青葉雨」", pos:"47% 0%" },
    { id:"w31", title:"雨ノ蛙「飛雨」", year:2025, motif:"カエル", desc:"風に流されて斜めに飛ぶ雨は、落ちるのではなく横切る。カエルの跳躍する姿勢は、その斜めの軌跡をそのまま留めている。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], img:"../img/work_w31.jpg", alt:"雨ノ蛙「飛雨」", pos:"50% 50%", zoom:"1.10" },
    { id:"w32", title:"雨粒蛙「夜雨」", year:2025, motif:"アマガエル", desc:"雨粒ほどの大きさで夜を過ごすアマガエルには、隠れる場所ばかりが条件になる。銀メッキの光は、闇の中でわずかに反射する雨粒そのものである。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング"]], img:"../img/work_w32.jpg", alt:"雨粒蛙「夜雨」", pos:"50% 50%" },
    { id:"w33", title:"青和金", year:2025, motif:"金魚（和金）", desc:"青という色は、金属がもっとも不安定な温度で見せる一瞬の発色。焼き色酸化は、その一瞬を通り過ぎずに留める技術である。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・焼き色酸化・硫化・樹脂封入"]], kanji:"青", img:"../img/work_w33.jpg", alt:"青和金", pos:"50% 50%" },
    { id:"w34", title:"黄朽葉頂天眼", year:2025, motif:"金魚（頂天眼）", desc:"朽葉色は、紅葉が終わったあとに残る色。頂天眼の上向きの眼は、その終わりの色を空に向けて見せ続けている。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・焼き色酸化・樹脂封入"]], kanji:"黄", img:"../img/work_w34.jpg", alt:"黄朽葉頂天眼", pos:"50% 50%" },
    { id:"w35", title:"黒和金", year:2025, motif:"金魚（和金）", desc:"赤に染まる前の和金と、赤を通り過ぎた和金は、同じ黒に行き着く。硫化は、その両端をひとつの色で重ねる工程である。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・樹脂封入"]], kanji:"黒", img:"../img/work_w35.jpg", alt:"黒和金", pos:"50% 50%" },
    { id:"w36", title:"黒浅葱水泡眼", year:2025, motif:"金魚（水泡眼）", desc:"浅葱色は、藍が薄まりきる直前の色。煮色酸化と硫化を重ねることで、黒との境界線上に留められている。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・煮色酸化・硫化・樹脂封入"]], kanji:"浅", img:"../img/work_w36.jpg", alt:"黒浅葱水泡眼", pos:"50% 50%" },
    { id:"w37", title:"黒珍珠鱗", year:2025, motif:"金魚（珍珠鱗）", desc:"珍珠鱗の粒立ちは、光を受けるための凹凸。硫化の黒は、その凹凸に濃淡の影を彫り込み、粒をひとつずつ際立たせる。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・樹脂封入"]], kanji:"黒", img:"../img/work_w37.jpg", alt:"黒珍珠鱗", pos:"50% 50%" },
    { id:"shuiro-wakin", title:"朱色和金", year:2024, en:"Vermilion Wakin", motif:"金魚（和金）", award:"第19回 藝大アートプラザ・アートアワード 小学館賞", desc:"真鍮で鋳込まれた金魚の肌に、酸化銅の粉末を幾度も擦り込んでいく。赤は熱と急冷が生むのではなく、手の反復という条件のなかで定着する。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入"],["展示","第19回 藝大アートプラザ・アートアワード展（2025年）<br>河﨑海斗展／新宿髙島屋（2026年7月22日〜28日）予定"]], img:"../img/work_shuiro-wakin.jpg", alt:"朱色和金 — 樹脂に封入された鋳金の和金" },
    { id:"w38", title:"緋色和金", year:2024, en:"Scarlet Wakin", motif:"金魚（和金）", desc:"緋銅酸化がつくる赤は、朱色よりも深く、燃え尽きる直前の熾火に近い。真鍮を含まない地金だけが、その深さを支えている。", specs:[["素材","銀・銅"],["技法","真空加圧鋳造法・石膏型・磨き・緋銅酸化・樹脂封入"]], kanji:"緋", img:"../img/work_w38.jpg", alt:"緋色和金", pos:"50% 50%" },
    { id:"w39", title:"苺飴", year:2024, motif:"果物（苺飴）", desc:"苺飴の艶は、舐められて溶ける途中の形。緋銅酸化がつくる赤は、金属でありながら、溶ける寸前の甘さの色を模している。", specs:[["素材","銅"],["技法","加圧鋳造法・石膏型・緋銅酸化・樹脂コーティング"]], kanji:"苺", img:"../img/work_w39.jpg", alt:"苺飴", pos:"47% 49%" },

    { id:"koku-chotengan", title:"黒頂天眼", year:2024, en:"Black Chotengan", motif:"金魚（頂天眼）", award:"第18回 藝大アートプラザ・アートアワード 審査員特別賞", desc:"上を向いて泳ぐ金魚「頂天眼」。緋銅の赤とは別の、黒という色の条件を金属に問うた作品。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・樹脂封入"],["展示","第18回 藝大アートプラザ・アートアワード展（2024年）<br>藝大アートプラザ・アートアワード受賞者招待展（2024年）"]], img:"../img/work_koku-chotengan.jpg", alt:"黒頂天眼 — 樹脂に封入された黒の頂天眼", pos:"51% 76%" },
    { id:"w44", title:"大黒蘭鋳", year:2023, motif:"金魚（蘭鋳）", desc:"真土型という土の型は、石膏型よりも荒く、金属の表情を大きく揺らす。大黒蘭鋳の黒は、その荒さを硫化がなだらかに均していく先にある。", specs:[["素材","青銅"],["技法","重力鋳造・真土型・磨き・硫化・樹脂コーティング"]], kanji:"大", img:"../img/work_w44.jpg", alt:"大黒蘭鋳", pos:"50% 50%" },
    { id:"w45", title:"黒蘭鋳", year:2023, motif:"金魚（蘭鋳）", desc:"丸みの中に沈む黒は、背びれのない蘭鋳の体を、輪郭よりも量塊として見せる。硫化は、その量塊感を最後に固定する工程である。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・硫化・樹脂封入"]], kanji:"黒", img:"../img/work_w45.jpg", alt:"黒蘭鋳", pos:"50% 50%" },
    { id:"yokai-henge", title:"溶解変化", year:2022, en:"Yokai Henge", motif:"タコ（妖怪変化）", desc:"殻、隙間、重さ、身を隠す場所。その条件のなかで、タコは別の存在として立ち上がる。", specs:[["素材","青銅"],["技法","真空加圧鋳造法・石膏型・鋳肌"]], kanji:"溶", img:"../img/work_yokai-henge.jpg", alt:"溶解変化", pos:"50% 50%" },
    { id:"hakomono-ranchu", title:"箱物 蘭鋳", year:2022, en:"Hakomono: Ranchu", motif:"金魚（蘭鋳）", desc:"水の外に出た金魚は、同じ姿を保っていても、別の存在へと移行する。失われるのはかたちではなく、条件である。", specs:[["素材","銀・銅・真鍮（アルミ入り）"],["技法","真空加圧鋳造法・石膏型・磨き・銀メッキ・樹脂コーティング"],["展示","第17回 藝大アートプラザ大賞展（2023年）入選"]], img:"../img/work_hakomono-ranchu.jpg", alt:"箱物 蘭鋳 — 樹脂の直方体に封入された蘭鋳" },
    { id:"w46", title:"鉄ノ鯨", year:2021, en:"The Iron Whale", motif:"鯨（潜水艦のような造形）", desc:"鯨と潜水艦、生き物と機械の境界があいまいな形。緑青と酸化チタン、二つの異なる青が、その境界の両側を同時に覆っている。", specs:[["素材","青銅"],["技法","重力鋳造・石膏型・緑青酸化・酸化チタンの焼き付け・硫化・蝋コーティング"]], kanji:"鯨", img:"../img/work_w46.jpg", alt:"鉄ノ鯨", pos:"39% 40%" },
    { id:"w47", title:"イトヒキイワシ", year:2020, motif:"深海魚（イトヒキイワシ）", desc:"深海という光の届かない条件のなかで、糸を引くように伸びるひれだけが情報を運ぶ。鉄を打って伸ばす鍛造は、その糸の頼りなさを金属の強さで裏返す。", specs:[["素材","鉄"],["技法","鍛金（鍛造）・油焼き"]], kanji:"イト" },
    { id:"kansho-no-kawa", title:"甘蕉ノ皮", year:2020, en:"Banana Peel", motif:"バナナの皮", desc:"壁、重力、腐敗、投げつけられた瞬間。その条件のなかで、バナナの皮は別の存在として立ち上がる。", specs:[["素材","青銅"],["技法","重力鋳造・石膏型・梨地・焼き色酸化・硫化"]], kanji:"蕉", img:"../img/work_kansho-no-kawa.jpg", alt:"甘蕉ノ皮", pos:"50% 50%" },
    { id:"w48", title:"蓑亀", year:2020, motif:"亀", desc:"甲羅に藻をまとう蓑亀は、動かないことで育つ姿。打ち出しの凹凸と硫化の濃淡が、その動かない時間の長さを彫り込んでいる。", specs:[["素材","銅"],["技法","彫金（打ち出し）・磨き・硫化・蝋コーティング"]], kanji:"蓑", img:"../img/work_w48.jpg", alt:"蓑亀", pos:"49% 13%" },
  ];

  function tileVisualHTML(w){
    if (w.img){
      var style = "";
      if (w.pos || w.zoom) style = ' style="' + (w.pos ? "object-position:" + w.pos + ";" : "") + (w.zoom ? "--zoom:" + w.zoom + ";" : "") + '"';
      return '<img src="' + w.img + '" alt="' + (w.alt || w.title) + '" loading="lazy"' + style + '>';
    }
    return '<span class="kanji">' + w.kanji + '</span>';
  }

  /* archive-gridは静的HTMLとして書き出し済み(SEO対策)。WORKS配列を編集したら
     scripts/gen_static_archive.js を再実行してarchiveセクションを再生成すること */
  var archive = document.getElementById("archive");
  if (window.KKEditMode) window.KKEditMode.scan();

  var modal = document.getElementById("workModal");
  var modalVisual = document.getElementById("modalVisual");
  var modalTitle = document.getElementById("modalTitle");
  var modalSub = document.getElementById("modalSub");
  var modalAward = document.getElementById("modalAward");
  var modalDesc = document.getElementById("modalDesc");
  var modalSpecs = document.getElementById("modalSpecs");
  var lastFocused = null;

  function openModal(w){
    modalVisual.innerHTML = tileVisualHTML(w);
    modalTitle.textContent = w.title;
    modalTitle.innerHTML += w.yearLabel ? " <small>" + w.yearLabel + "</small>" : " <small>" + w.year + "</small>";
    var sub = w.en || w.motif || "";
    if (sub){ modalSub.textContent = sub; modalSub.hidden = false; }
    else { modalSub.hidden = true; }
    if (w.award){ modalAward.textContent = w.award; modalAward.hidden = false; }
    else { modalAward.hidden = true; }
    if (w.desc){ modalDesc.textContent = w.desc; modalDesc.hidden = false; }
    else { modalDesc.hidden = true; }
    modalSpecs.innerHTML = w.specs.map(function(s){
      return "<div><dt>" + s[0] + "</dt><dd>" + s[1] + "</dd></div>";
    }).join("");
    lastFocused = document.activeElement;
    modal.hidden = false;
    requestAnimationFrame(function(){ modal.classList.add("open"); });
    modal.querySelector(".work-modal-close").focus();
    document.body.style.overflow = "hidden";
  }

  function closeModal(){
    modal.classList.remove("open");
    document.body.style.overflow = "";
    window.setTimeout(function(){ modal.hidden = true; }, 250);
    if (lastFocused) lastFocused.focus();
  }

  archive.addEventListener("click", function(e){
    var tile = e.target.closest(".archive-tile");
    if (!tile) return;
    var w = WORKS.filter(function(x){ return x.id === tile.dataset.id; })[0];
    if (w) openModal(w);
  });

  modal.addEventListener("click", function(e){
    if (e.target.closest("[data-close]")) closeModal();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !modal.hidden) closeModal();
  });

  var yEl = document.getElementById("cpyear");
  if (yEl){
    var y = new Date().getFullYear();
    if (y > 2026) yEl.textContent = "2026–" + y;
  }

  /* トップページの代表作品カードなどから #id で直接開けるようにする */
  if (location.hash){
    var deepLinked = WORKS.filter(function(w){ return "#" + w.id === location.hash; })[0];
    if (deepLinked) openModal(deepLinked);
  }
})();
</script>
